# FinCast - central settings file
# Every path is relative to the project root. Loaded by load_config() in src/utils/helpers.py.

project:
  name: FinCast
  seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  data_sample: data/sample
  models: models
  logs: logs

categories_file: config/categories.yaml   # category names + keyword rules
categorizer:
  confidence_threshold: 0.5     # model guesses below this become "Other" + needs_review (step 5.4)
  model_file: categorizer.joblib          # in paths.models (committed, loaded by the app)
  meta_file: categorizer_meta.json

database:
  path: data/app.db

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiments:
    forecast_income: forecast_income
    forecast_spend: forecast_spend
    categorizer: categorizer
    anomaly: anomaly
    baselines: baselines

forecast:
  horizon_months: 1             # predict next month only
  quantiles: [0.1, 0.5, 0.9]    # lower bound, median, upper bound
  min_history_months: 3         # fewer months -> friendly message, no forecast
  cold_start_months: 6          # fewer months -> global model with a visible note

synthetic:
  n_users: 300                  # generated training users
  months: 36                    # history length per user
  start: "2023-10-01"           # first month (36 months -> Oct 2023 to Sep 2026)
  transactions_file: synthetic_transactions.csv   # written to paths.data_raw
  users_file: synthetic_users.csv

macro:
  base_url: https://data-api.ecb.europa.eu/service/data
  series:                       # ECB Data Portal series keys (dataflow/key)
    inflation_de: ICP/M.DE.N.000000.4.ANR        # HICP Germany, annual rate of change, %
    ecb_rate: FM/B.U2.EUR.4F.KR.MRR_FR.LEV       # ECB main refinancing rate, %
  start: "2022-10"              # 12 months before the synthetic data, so lagged features exist
  cache_file: macro.csv         # written to paths.data_raw (git-ignored)
  committed_cache_file: macro_cached.csv   # written to paths.data_sample (committed, used offline)
  timeout_seconds: 20

calendar:
  file: calendar.csv            # monthly holiday counts, written to paths.data_raw

locale:
  country: DE                   # holiday calendar (holidays package)
  currency: EUR
